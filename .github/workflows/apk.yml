name: Build Fire TV app
on:
  push:
    branches: [main, claude/optimistic-allen-saong9]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nowguide.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest Fire TV app" --notes "Install nowguide.apk on your Fire Stick."
          gh release upload latest nowguide.apk --clobber
